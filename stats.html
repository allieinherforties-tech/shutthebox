<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shut the Box · Daily Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --cream:#F4EFE3; --navy:#1F2A44; --brass:#D9A02A; --brass-dark:#B8860B;
    --warm-gray:#8A8272; --line:#E3DAC6;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--cream); color:var(--navy);
    font-family:'Nunito',sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:40px 16px 60px;
  }
  .wrap{width:100%;max-width:640px;}
  h1{font-family:'Zilla Slab',serif;font-size:30px;font-weight:700;}
  .sub{color:var(--warm-gray);font-size:14px;font-weight:700;margin:6px 0 24px;}
  .state{color:var(--warm-gray);font-size:14px;padding:24px 0;}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;
        box-shadow:0 1px 4px rgba(31,42,68,.12);}
  th,td{padding:10px 12px;font-size:14px;text-align:right;border-bottom:1px solid var(--line);}
  th:first-child,td:first-child{text-align:left;}
  th{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--warm-gray);
     background:var(--cream);}
  td.date b{font-weight:800;} td.date span{color:var(--warm-gray);font-size:12px;}
  td.best{font-weight:800;color:var(--brass-dark);}
  tr.perfect td{background:#FDF6E4;}
  .foot{margin-top:24px;text-align:center;}
  .foot a{color:var(--navy);font-weight:800;font-size:14px;text-decoration:none;
          border:2px solid var(--navy);border-radius:999px;padding:10px 22px;display:inline-block;}
</style>
</head>
<body>
  <div class="wrap">
    <h1>Shut the Box · Daily Stats</h1>
    <div class="sub">Daily Challenge plays — everyone faces the same dice each day. Lower score is better.</div>
    <div class="state" id="state">Loading…</div>
    <table id="tbl" hidden>
      <thead>
        <tr><th>Date</th><th>Players</th><th>Avg score</th><th>Best</th><th>Perfect</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="foot"><a href="./">← Play today’s challenge</a></div>
  </div>
  <script type="module">
    import { API_BASE } from './config.js';
    import { dayNumber, formatDateShort } from './logic.js';

    const state = document.getElementById('state');
    const tbl = document.getElementById('tbl');
    const rows = document.getElementById('rows');

    try {
      const res = await fetch(API_BASE + '/api/stats', { cache: 'no-store' });
      if (!res.ok) throw new Error('stats API ' + res.status);
      const { days } = await res.json();
      if (!days || !days.length) {
        state.textContent = 'No plays recorded yet.';
      } else {
        for (const d of days) {
          const tr = document.createElement('tr');
          if (d.perfects > 0) tr.className = 'perfect';
          tr.innerHTML =
            '<td class="date"><b>' + formatDateShort(d.day) + '</b> <span>Day ' + dayNumber(d.day) + '</span></td>' +
            '<td>' + d.plays + '</td>' +
            '<td>' + d.avg + '</td>' +
            '<td class="best">' + d.best + '</td>' +
            '<td>' + (d.perfects ? '×' + d.perfects : '—') + '</td>';
          rows.appendChild(tr);
        }
        state.hidden = true;
        tbl.hidden = false;
      }
    } catch (err) {
      state.textContent = 'Stats are offline right now — try again later.';
      console.warn('Stats unavailable:', err);
    }
  </script>
</body>
</html>
